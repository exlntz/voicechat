# Описание Xcode-проекта для XcodeGen: сам .xcodeproj в git не храним,
# его собирает CI (.github/workflows/build-ios.yml) командой `xcodegen generate`.
name: VoiceLobby
options:
  bundleIdPrefix: online.voicelobby
  deploymentTarget:
    iOS: "16.0"

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.0

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  VoiceLobby:
    type: application
    platform: iOS
    sources:
      - VoiceLobby
      - Shared
    dependencies:
      - package: LiveKit
      - target: VoiceLobbyBroadcast
        embed: true
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.voicelobby.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: VoiceLobby/VoiceLobby.entitlements
      properties:
        com.apple.security.application-groups:
          - group.online.voicelobby.app
    info:
      path: VoiceLobby/Info.plist
      properties:
        CFBundleDisplayName: Voice Lobby
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - voip
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы собеседники слышали вас в звонке.
        NSCameraUsageDescription: Камера нужна, чтобы собеседники видели вас в звонке.
        ITSAppUsesNonExemptEncryption: false
        # Демонстрация экрана (LiveKit). Под SideStore реальные значения подставляет InfoOverrides.
        RTCAppGroupIdentifier: group.online.voicelobby.app
        RTCScreenSharingExtension: online.voicelobby.app.broadcast

  # Расширение ReplayKit для демонстрации экрана с телефона
  VoiceLobbyBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - BroadcastExtension
      - Shared
    dependencies:
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.voicelobby.app.broadcast
    entitlements:
      path: BroadcastExtension/VoiceLobbyBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.online.voicelobby.app
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: Voice Lobby
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RTCAppGroupIdentifier: group.online.voicelobby.app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
