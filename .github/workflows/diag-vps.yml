# Диагностика сервера звонков (только чтение, ничего не меняет).
# Запуск вручную: Actions -> Diagnose VPS -> Run workflow.
# Ключи и секреты в лог не попадают: конфиг LiveKit печатается с маскировкой,
# IP-адреса в логах LiveKit тоже скрываются.

name: Diagnose VPS

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Подготовить SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Снять диагностику
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          export PATH="$PATH:/usr/local/bin:/usr/local/sbin"
          maskip() { sed -E 's/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/x.x.x.x/g'; }
          sec() { echo; echo "===== $1 ====="; }

          sec "система"
          uname -r; nproc; uptime; free -m; df -h / | tail -1
          sec "CPU за 5 секунд (us sy id wa st)"
          vmstat 1 6 2>/dev/null || top -bn1 | head -5
          sec "топ процессов по CPU"
          ps -eo pid,pcpu,pmem,rss,comm --sort=-pcpu | head -12

          sec "сеть: трафик за 5 секунд"
          IF=$(ip route show default | awk '{print $5; exit}')
          echo "iface=$IF speed=$(cat /sys/class/net/$IF/speed 2>/dev/null)Mbit mtu=$(cat /sys/class/net/$IF/mtu)"
          r1=$(cat /sys/class/net/$IF/statistics/rx_bytes); t1=$(cat /sys/class/net/$IF/statistics/tx_bytes)
          sleep 5
          r2=$(cat /sys/class/net/$IF/statistics/rx_bytes); t2=$(cat /sys/class/net/$IF/statistics/tx_bytes)
          echo "rx $(( (r2-r1)*8/5/1000 )) kbit/s, tx $(( (t2-t1)*8/5/1000 )) kbit/s"
          ip -s link show "$IF" | sed -n '1,12p'
          tc qdisc show dev "$IF" 2>/dev/null
          sec "UDP: ошибки и переполнения буферов"
          grep -A1 '^Udp:' /proc/net/snmp
          sysctl net.core.rmem_max net.core.wmem_max net.core.rmem_default net.core.netdev_max_backlog 2>/dev/null

          sec "docker"
          docker ps --format '{{.Names}}  {{.Image}}  {{.Status}}  {{.Ports}}' 2>/dev/null
          docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}}' 2>/dev/null
          LK=$(docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null | awk '/livekit\/livekit-server|livekit-server/{print $1; exit}')
          echo "livekit container: $LK"
          [ -n "$LK" ] && docker inspect "$LK" --format 'network={{.HostConfig.NetworkMode}} restart={{.HostConfig.RestartPolicy.Name}} started={{.State.StartedAt}} restarts={{.RestartCount}} cpus={{.HostConfig.NanoCpus}} mem={{.HostConfig.Memory}}'
          ls /opt/livekit 2>/dev/null

          sec "livekit.yaml (ключи скрыты)"
          if [ -f /opt/livekit/livekit.yaml ]; then
            awk '
              /^[^ #]/ { inkeys = ($1 == "keys:") }
              inkeys && /^[ \t]+[^ #]/ { print "  ***: ***"; next }
              tolower($0) ~ /(secret|password|credential|api_key|apikey|token)[a-z_]*:/ { sub(/:.*/, ": ***"); print; next }
              { print }
            ' /opt/livekit/livekit.yaml | maskip
          fi

          sec "livekit логи: счётчики за 2 часа"
          if [ -n "$LK" ]; then
            docker logs --since 2h "$LK" > /tmp/lk.log 2>&1
            echo "строк: $(wc -l < /tmp/lk.log)"
            for k in WARN ERROR "TCP" "turn" "relay" "nack" "pli" "congest" "packet loss" "quality" "reconnect" "ICE" "dropping" "buffer"; do
              printf '%-14s %s\n' "$k" "$(grep -ci "$k" /tmp/lk.log)"
            done
            sec "livekit: последние WARN/ERROR (IP скрыты)"
            grep -Ei 'warn|error' /tmp/lk.log | tail -40 | cut -c1-400 | maskip
            sec "livekit: последние 25 строк (IP скрыты)"
            tail -25 /tmp/lk.log | cut -c1-400 | maskip
            rm -f /tmp/lk.log
          fi

          sec "livekit: статистика потоков за 24 часа (потери)"
          if [ -n "$LK" ]; then
            docker logs --since 24h "$LK" > /tmp/lk2.log 2>&1
            echo "строк: $(wc -l < /tmp/lk2.log)"
            echo "--- типы сообщений"
            awk -F'\t' '{print $2" "$5}' /tmp/lk2.log | sort | uniq -c | sort -rn | head -40
            echo "--- строки с loss/lost (последние 30, обрезаны)"
            grep -Ei 'packetsLost|lossRate|packetLoss|"lost"' /tmp/lk2.log | tail -30 | cut -c1-3000 | maskip
            echo "--- ICE: выбранные пары"
            grep -Ei 'selected|candidate pair|ice connected|connectionType' /tmp/lk2.log | grep -oEi '(udp|tcp|tls|turn|relay|prflx|srflx|host)[a-z_/ :"]{0,30}' | tr 'A-Z' 'a-z' | sort | uniq -c | sort -rn | head -20
            rm -f /tmp/lk2.log
          fi
          sec "статистика звонков с клиентов (последние 120 записей)"
          tail -n 120 /opt/zvonki-backend/data/call-stats.log 2>/dev/null | maskip
          wc -l /opt/zvonki-backend/data/call-stats.log 2>/dev/null

          sec "TURN TLS сертификат"
          echo | timeout 8 openssl s_client -connect 127.0.0.1:5349 -servername turn.voicelobby.online 2>/dev/null | openssl x509 -noout -subject -enddate -ext subjectAltName 2>&1 | head -8
          getent hosts turn.voicelobby.online | maskip

          sec "порты"
          ss -lunp 2>/dev/null | grep -E ':(3478|7881|7882|443|5349)\b|livekit' | head -20
          echo "UDP сокетов livekit: $(ss -uanp 2>/dev/null | grep -c livekit)"
          ss -ltnp 2>/dev/null | grep -E ':(443|7880|7881|5349|3001)\b'
          sec "firewall"
          ufw status 2>/dev/null | head -30
          sec "pm2"
          pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const p of JSON.parse(s))console.log(p.name,p.pm2_env.status,"restarts="+p.pm2_env.restart_time,"cpu="+p.monit.cpu,"mem="+Math.round(p.monit.memory/1e6)+"MB")}catch(e){console.log("pm2 n/a")}})'
          REMOTE

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
