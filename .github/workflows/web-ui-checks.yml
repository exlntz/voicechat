name: Web UI checks

on:
  push:
    branches: ['redesign/discord-ui']
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ui-checks.yml'

permissions:
  contents: read

concurrency:
  group: web-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check browser JavaScript syntax
        run: find public/static -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Test quick switcher and asset contracts
        run: node --test tests/*.test.js
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build web app
        run: npm run build
