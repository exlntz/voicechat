<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Аннотации</title>
<style>
  /* Окно прозрачное: фон обязан быть полностью прозрачным, иначе Windows нарисует чёрный прямоугольник */
  /* Voice Lobby · панель аннотаций.
     Хром панели в том же языке, что и сайт: тёмные поверхности, синий акцент,
     умеренные радиусы, системный шрифт.
     Палитра рисования (свотчи) не тронута — это рабочие цвета карандаша. */
  :root {
    --ink: #0f1115;
    --bone: #f2f5f9;
    --bone-dim: rgba(242, 245, 249, 0.62);
    --accent: #0458cf;
    --accent-lt: #6ea8f5;
    --signal: #d94a3d;
    --rule: rgba(242, 245, 249, 0.14);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mno: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.16, 0.84, 0.24, 1);
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: var(--mno);
    cursor: default; user-select: none;
  }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  body.drawing #canvas { cursor: crosshair; }

  /* Режим мыши: рисунок остаётся на экране, но холст не ловит курсор -
     клики уходят в обычные программы, можно листать и двигать что угодно. */
  body.cursor-mode #canvas { pointer-events: none; cursor: default; }

  /* Пока рисование выключено, панель не показываем */
  #bar, #hint { display: none; }
  body.drawing #bar { display: flex; }
  body.drawing.show-hint #hint { display: flex; }

  /* Рамки по краю экрана СПЕЦИАЛЬНО нет: она попадала в стрим и мешала смотреть. */

  #bar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    align-items: center; gap: 6px; padding: 9px 11px;
    background: rgba(21, 24, 30, 0.96);
    border: 1px solid var(--rule);
    border-top: 2px solid var(--accent);
    border-radius: 16px;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
    z-index: 10;
  }

  /* Вертикальный режим: включается автоматически, если панель перетащили к левому или правому краю */
  #bar.vert { flex-direction: column; }
  #bar.vert .sep { width: 24px; height: 1px; margin: 4px 0; }
  #bar.vert #colors, #bar.vert #widths { flex-direction: column; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 34px; height: 34px; padding: 0 8px;
    border: 1px solid var(--rule); border-radius: 10px;
    background: rgba(242, 245, 249, 0.04); color: var(--bone);
    font-family: var(--mno); font-size: 15px; line-height: 1; cursor: pointer;
    transition: background 160ms var(--ease), border-color 160ms var(--ease), transform 140ms var(--ease);
  }
  .btn:hover { background: rgba(4, 88, 207, 0.22); border-color: var(--accent); transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--accent-lt); outline-offset: 2px; }
  .btn.sel { background: var(--accent); border-color: var(--accent-lt); color: #fff; }
  .btn.danger:hover { background: var(--signal); border-color: var(--signal); color: #fff; }
  .sep { width: 1px; height: 24px; margin: 0 4px; background: var(--rule); }
  .swatch { width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--rule); cursor: pointer; transition: transform 140ms var(--ease), border-color 140ms var(--ease); }
  .swatch:hover { border-color: var(--accent); }
  .swatch.sel { border-color: var(--bone); transform: scale(1.14); box-shadow: 0 0 0 1px rgba(110, 168, 245, 0.6); }
  .wbtn { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--rule); background: rgba(242, 245, 249, 0.04); cursor: pointer; display:inline-flex; align-items:center; justify-content:center; transition: background 160ms var(--ease), border-color 160ms var(--ease); }
  .wbtn:hover { border-color: var(--accent); }
  .wbtn.sel { background: var(--accent); border-color: var(--accent-lt); }
  .wdot { background: #fff; border-radius: 50%; }

  /* За эту ручку панель можно таскать по экрану */
  #grip {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 30px; color: var(--accent-lt); font-size: 15px;
    cursor: grab; border-radius: 8px;
  }
  #grip:hover { background: rgba(4, 88, 207, 0.18); color: var(--accent-lt); }
  #grip.dragging { cursor: grabbing; }

  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    padding: 9px 15px; border-radius: 12px;
    background: rgba(15, 17, 21, 0.92); color: var(--bone-dim);
    font: 500 11px/1.2 var(--sans); letter-spacing: 0.01em;
    border: 1px solid var(--rule); pointer-events: none;
    transition: opacity 0.4s ease; opacity: 1;
  }
  #hint.fade { opacity: 0; }
  #textInput {
    position: fixed; display: none; z-index: 20;
    background: rgba(15,17,21,0.96); color: var(--bone); border: 1px solid var(--accent);
    border-radius: 10px; padding: 8px 10px; font-family: var(--sans); font-size: 18px; outline: none; min-width: 160px;
  }
  #textInput:focus { border-color: var(--accent-lt); box-shadow: 0 0 0 1px rgba(110, 168, 245, 0.45); }
  #textInput::placeholder { color: rgba(242, 245, 249, 0.35); font-style: italic; }
  @media (prefers-reduced-motion: reduce) {
    .btn:hover { transform: none; }
    .swatch.sel { transform: none; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<input id="textInput" type="text" placeholder="текст + Enter" />

<div id="bar">
  <div id="grip" title="Перетащить панель (к левому/правому краю - станет вертикальной)">⁙</div>
  <button class="btn" id="cursor" title="Режим мыши: рисунок остаётся, можно работать в программах (F7)">🖱️</button>
  <div class="sep"></div>
  <button class="btn" data-tool="pen" title="Карандаш (P)">✏️</button>
  <button class="btn" data-tool="marker" title="Маркер (M)">🖍️</button>
  <button class="btn" data-tool="arrow" title="Стрелка (A)">➜</button>
  <button class="btn" data-tool="line" title="Линия (L)">╱</button>
  <button class="btn" data-tool="rect" title="Прямоугольник (R)">▭</button>
  <button class="btn" data-tool="ellipse" title="Овал (O)">◯</button>
  <button class="btn" data-tool="text" title="Текст (T)">T</button>
  <button class="btn" data-tool="eraser" title="Ластик (E)">🧽</button>
  <div class="sep"></div>
  <div id="colors"></div>
  <div class="sep"></div>
  <div id="widths"></div>
  <div class="sep"></div>
  <button class="btn" id="undo" title="Отменить (Ctrl+Z)">↶</button>
  <button class="btn danger" id="clear" title="Стереть всё (Ctrl+Shift+X)">🗑</button>
  <button class="btn" id="done" title="Выйти из рисования (Esc)">✕</button>
</div>

<div id="hint">F7 - мышь/рисование · F8 - выйти · панель можно таскать за точки слева</div>

<script>
(function () {
  'use strict'

  var canvas = document.getElementById('canvas')
  var ctx = canvas.getContext('2d')
  var bar = document.getElementById('bar')
  var grip = document.getElementById('grip')
  var hint = document.getElementById('hint')
  var cursorBtn = document.getElementById('cursor')
  var textInput = document.getElementById('textInput')
  var api = window.overlayAPI || null

  var COLORS = ['#ff3b30', '#ffd60a', '#32d74b', '#0a84ff', '#ffffff', '#111111']
  var WIDTHS = [2, 4, 8, 16]
  var EDGE_SNAP = 130   // насколько близко к краю надо подтащить, чтобы панель стала вертикальной

  // Инструмент "Лазер" убран. У тех, кто его выбирал, он лежит в localStorage -
  // без подмены на 'pen' панель открылась бы вообще без выбранного инструмента.
  var savedTool = localStorage.getItem('ovTool')
  if (savedTool === 'laser') { savedTool = 'pen'; localStorage.setItem('ovTool', savedTool) }

  var state = {
    active: false,
    tool: savedTool || 'pen',
    color: localStorage.getItem('ovColor') || COLORS[0],
    width: Number(localStorage.getItem('ovWidth')) || 4
  }

  var strokes = []       // завершённые фигуры
  var current = null     // фигура, которую рисуем прямо сейчас
  var dirty = true

  // ---------- размер холста с учётом масштабирования Windows ----------
  function resize() {
    var dpr = window.devicePixelRatio || 1
    canvas.width = Math.round(window.innerWidth * dpr)
    canvas.height = Math.round(window.innerHeight * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    dirty = true
  }
  window.addEventListener('resize', function () { resize(); clampBar() })
  resize()

  // ---------- отрисовка ----------
  function drawShape(s) {
    var pts = s.points
    if (!pts.length) return
    ctx.save()
    ctx.lineCap = 'round'
    ctx.lineJoin = 'round'
    ctx.strokeStyle = s.color
    ctx.fillStyle = s.color
    ctx.lineWidth = s.width
    if (s.tool === 'marker') {
      ctx.globalAlpha = 0.38
      ctx.lineWidth = s.width * 3
    }

    var a = pts[0]
    var b = pts[pts.length - 1]

    if (s.tool === 'pen' || s.tool === 'marker') {
      ctx.beginPath()
      ctx.moveTo(pts[0].x, pts[0].y)
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y)
      ctx.stroke()
    } else if (s.tool === 'line') {
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
    } else if (s.tool === 'rect') {
      ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y)
    } else if (s.tool === 'ellipse') {
      ctx.beginPath()
      ctx.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2, Math.abs(b.y - a.y) / 2, 0, 0, Math.PI * 2)
      ctx.stroke()
    } else if (s.tool === 'arrow') {
      var head = Math.max(12, s.width * 4)
      var ang = Math.atan2(b.y - a.y, b.x - a.x)
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
      ctx.beginPath()
      ctx.moveTo(b.x, b.y)
      ctx.lineTo(b.x - head * Math.cos(ang - Math.PI / 7), b.y - head * Math.sin(ang - Math.PI / 7))
      ctx.lineTo(b.x - head * Math.cos(ang + Math.PI / 7), b.y - head * Math.sin(ang + Math.PI / 7))
      ctx.closePath()
      ctx.fill()
    } else if (s.tool === 'text' && s.text) {
      ctx.font = '600 ' + Math.max(16, s.width * 6) + 'px Segoe UI, sans-serif'
      ctx.textBaseline = 'top'
      ctx.lineWidth = 4
      ctx.strokeStyle = 'rgba(0,0,0,0.55)'
      ctx.strokeText(s.text, a.x, a.y)
      ctx.fillText(s.text, a.x, a.y)
    }
    ctx.restore()
  }

  function render() {
    if (dirty) {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      for (var i = 0; i < strokes.length; i++) drawShape(strokes[i])
      if (current) drawShape(current)
      dirty = false
    }
    requestAnimationFrame(render)
  }
  requestAnimationFrame(render)

  // ---------- ластик: удаляем фигуру под курсором ----------
  function eraseAt(x, y) {
    var r = 14
    for (var i = strokes.length - 1; i >= 0; i--) {
      var pts = strokes[i].points
      for (var j = 0; j < pts.length; j++) {
        if (Math.abs(pts[j].x - x) < r && Math.abs(pts[j].y - y) < r) {
          strokes.splice(i, 1)
          dirty = true
          return
        }
      }
      // для фигур по двум точкам проверяем ещё и рамку
      if (pts.length === 2) {
        var a = pts[0], b = pts[1]
        if (x > Math.min(a.x, b.x) - r && x < Math.max(a.x, b.x) + r &&
            y > Math.min(a.y, b.y) - r && y < Math.max(a.y, b.y) + r) {
          strokes.splice(i, 1)
          dirty = true
          return
        }
      }
    }
  }

  // ---------- ввод мышью ----------
  var drawingNow = false

  canvas.addEventListener('pointerdown', function (e) {
    if (!state.active || cursorMode) return
    canvas.setPointerCapture(e.pointerId)
    var x = e.clientX, y = e.clientY

    if (state.tool === 'eraser') { drawingNow = true; eraseAt(x, y); return }
    if (state.tool === 'text') { openTextInput(x, y); return }

    drawingNow = true
    current = { tool: state.tool, color: state.color, width: state.width, points: [{ x: x, y: y }] }
    dirty = true
  })

  canvas.addEventListener('pointermove', function (e) {
    if (!state.active || !drawingNow) return
    var x = e.clientX, y = e.clientY

    if (state.tool === 'eraser') { eraseAt(x, y); return }
    if (!current) return

    if (current.tool === 'pen' || current.tool === 'marker') {
      current.points.push({ x: x, y: y })
    } else {
      current.points[1] = { x: x, y: y }
    }
    dirty = true
  })

  function finish() {
    drawingNow = false
    if (current && current.points.length > 1) strokes.push(current)
    current = null
    dirty = true
  }
  canvas.addEventListener('pointerup', finish)
  canvas.addEventListener('pointercancel', finish)

  // ---------- текст ----------
  var textPos = null
  function openTextInput(x, y) {
    textPos = { x: x, y: y }
    textInput.style.display = 'block'
    textInput.style.left = x + 'px'
    textInput.style.top = y + 'px'
    textInput.style.color = state.color
    textInput.value = ''
    setTimeout(function () { textInput.focus() }, 0)
  }
  function closeTextInput(commit) {
    if (commit && textPos && textInput.value.trim()) {
      strokes.push({ tool: 'text', color: state.color, width: state.width, points: [textPos], text: textInput.value.trim() })
      dirty = true
    }
    textInput.style.display = 'none'
    textPos = null
  }
  textInput.addEventListener('keydown', function (e) {
    e.stopPropagation()
    if (e.key === 'Enter') closeTextInput(true)
    if (e.key === 'Escape') closeTextInput(false)
  })

  // ---------- панель инструментов ----------
  var colorsBox = document.getElementById('colors')
  COLORS.forEach(function (c) {
    var d = document.createElement('span')
    d.className = 'swatch'
    d.style.background = c
    d.dataset.color = c
    d.addEventListener('click', function () { setColor(c) })
    colorsBox.appendChild(d)
  })
  colorsBox.style.display = 'inline-flex'
  colorsBox.style.gap = '6px'
  colorsBox.style.alignItems = 'center'

  var widthsBox = document.getElementById('widths')
  WIDTHS.forEach(function (w) {
    var b = document.createElement('span')
    b.className = 'wbtn'
    b.dataset.width = String(w)
    var dot = document.createElement('span')
    dot.className = 'wdot'
    dot.style.width = Math.min(16, w + 3) + 'px'
    dot.style.height = Math.min(16, w + 3) + 'px'
    b.appendChild(dot)
    b.addEventListener('click', function () { setWidth(w) })
    widthsBox.appendChild(b)
  })
  widthsBox.style.display = 'inline-flex'
  widthsBox.style.gap = '6px'
  widthsBox.style.alignItems = 'center'

  function syncBar() {
    var toolBtns = bar.querySelectorAll('[data-tool]')
    for (var i = 0; i < toolBtns.length; i++) {
      toolBtns[i].classList.toggle('sel', toolBtns[i].dataset.tool === state.tool)
    }
    var sw = colorsBox.querySelectorAll('.swatch')
    for (var j = 0; j < sw.length; j++) sw[j].classList.toggle('sel', sw[j].dataset.color === state.color)
    var wb = widthsBox.querySelectorAll('.wbtn')
    for (var k = 0; k < wb.length; k++) wb[k].classList.toggle('sel', Number(wb[k].dataset.width) === state.width)
    cursorBtn.classList.toggle('sel', cursorMode)
  }

  function setTool(t) {
    state.tool = t
    localStorage.setItem('ovTool', t)
    // Выбрал инструмент - очевидно хочет рисовать, а не возить мышкой.
    if (cursorMode) setCursorMode(false)
    syncBar()
  }
  function setColor(c) { state.color = c; localStorage.setItem('ovColor', c); syncBar() }
  function setWidth(w) { state.width = w; localStorage.setItem('ovWidth', String(w)); syncBar() }

  bar.addEventListener('click', function (e) {
    var el = e.target.closest('[data-tool]')
    if (el) { setTool(el.dataset.tool); return }
  })
  document.getElementById('undo').addEventListener('click', undo)
  document.getElementById('clear').addEventListener('click', clearAll)
  document.getElementById('done').addEventListener('click', function () {
    if (api) api.exit()
  })
  cursorBtn.addEventListener('click', function () { setCursorMode(!cursorMode) })

  function undo() { strokes.pop(); dirty = true }
  function clearAll() { strokes = []; current = null; dirty = true }

  // ================= Режим мыши =================
  // Самое важное удобство: рисунок и панель остаются на экране, но клики уходят
  // в программы под оверлеем - можно листать, переключать окна, двигать что угодно.
  //
  // Техника: окно переводим в setIgnoreMouseEvents(true, { forward: true }). При forward оно продолжает
  // получать mousemove, хотя клики уже не ловит. По этим mousemove понимаем, когда курсор
  // навёлся на панель, и на это время возвращаем захват мыши - так кнопки остаются рабочими.
  var cursorMode = false
  var ignoreNow = false

  function setIgnore(ig) {
    if (ig === ignoreNow) return
    ignoreNow = ig
    if (api && api.setMouseIgnore) api.setMouseIgnore(ig)
  }

  function overBar(x, y) {
    var r = bar.getBoundingClientRect()
    var pad = 8
    return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad
  }

  function setCursorMode(on) {
    cursorMode = !!on
    document.body.classList.toggle('cursor-mode', cursorMode)
    // Недорисованную фигуру бросаем, чтобы она не тянулась за курсором.
    drawingNow = false
    if (current) { current = null; dirty = true }
    closeTextInput(false)

    if (cursorMode) {
      setIgnore(true)
    } else {
      setIgnore(false)
      // Без возврата фокуса не работали бы локальные клавиши инструментов и Esc.
      if (api && api.focusOverlay) api.focusOverlay()
    }
    syncBar()
  }

  window.addEventListener('mousemove', function (e) {
    if (!state.active || !cursorMode || dragging) return
    setIgnore(!overBar(e.clientX, e.clientY))
  })

  // ================= Перетаскивание панели =================
  var dragging = false
  var dragDx = 0
  var dragDy = 0

  function place(left, top) {
    bar.style.transform = 'none'
    bar.style.left = Math.round(left) + 'px'
    bar.style.top = Math.round(top) + 'px'
  }

  function setVertical(v) {
    bar.classList.toggle('vert', !!v)
  }

  function clampBar() {
    if (!bar.style.left) return
    var r = bar.getBoundingClientRect()
    place(
      Math.min(Math.max(8, r.left), Math.max(8, window.innerWidth - r.width - 8)),
      Math.min(Math.max(8, r.top), Math.max(8, window.innerHeight - r.height - 8))
    )
  }

  function saveBarPos() {
    var r = bar.getBoundingClientRect()
    try {
      localStorage.setItem('ovBar', JSON.stringify({
        left: r.left, top: r.top, vert: bar.classList.contains('vert')
      }))
    } catch (err) { /* не критично */ }
  }

  function restoreBarPos() {
    var raw = null
    try { raw = localStorage.getItem('ovBar') } catch (err) { raw = null }
    if (!raw) return
    var p = null
    try { p = JSON.parse(raw) } catch (err) { return }
    if (!p || typeof p.left !== 'number') return
    setVertical(!!p.vert)
    place(p.left, p.top)
    clampBar()
  }

  // К левому/правому краю - панель становится вертикальной и прилипает к краю.
  function snapBar() {
    var r = bar.getBoundingClientRect()
    var cx = r.left + r.width / 2
    var edge = null
    if (cx < EDGE_SNAP) edge = 'left'
    else if (cx > window.innerWidth - EDGE_SNAP) edge = 'right'

    var keepTop = r.top
    setVertical(!!edge)

    // После смены ориентации размеры другие - измеряем заново.
    var r2 = bar.getBoundingClientRect()
    var left
    if (edge === 'left') left = 8
    else if (edge === 'right') left = window.innerWidth - r2.width - 8
    else left = Math.min(Math.max(8, r.left), Math.max(8, window.innerWidth - r2.width - 8))

    var top = Math.min(Math.max(8, keepTop), Math.max(8, window.innerHeight - r2.height - 8))
    place(left, top)
    saveBarPos()
  }

  grip.addEventListener('pointerdown', function (e) {
    if (!state.active) return
    e.preventDefault()
    var r = bar.getBoundingClientRect()
    place(r.left, r.top)      // фиксируем текущее место, чтобы уйти от transform: translateX(-50%)
    dragging = true
    dragDx = e.clientX - r.left
    dragDy = e.clientY - r.top
    grip.classList.add('dragging')
    grip.setPointerCapture(e.pointerId)
    // На время перетаскивания окно должно держать мышь, даже в режиме мыши.
    setIgnore(false)
  })

  grip.addEventListener('pointermove', function (e) {
    if (!dragging) return
    place(e.clientX - dragDx, e.clientY - dragDy)
  })

  function endDrag(e) {
    if (!dragging) return
    dragging = false
    grip.classList.remove('dragging')
    snapBar()
    if (cursorMode) setIgnore(!overBar(e.clientX, e.clientY))
  }
  grip.addEventListener('pointerup', endDrag)
  grip.addEventListener('pointercancel', endDrag)

  restoreBarPos()

  // ---------- клавиатура ----------
  var HOTKEYS = { p: 'pen', m: 'marker', a: 'arrow', l: 'line', r: 'rect', o: 'ellipse', t: 'text', e: 'eraser' }
  window.addEventListener('keydown', function (e) {
    if (!state.active) return
    if (e.key === 'Escape') {
      if (textPos) { closeTextInput(false); return }
      if (api) api.exit()
      return
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')) { e.preventDefault(); undo(); return }
    var k = e.key.toLowerCase()
    if (k === 'c' || k === 'с') { setCursorMode(!cursorMode); return }
    if (HOTKEYS[k]) setTool(HOTKEYS[k])
  })

  // ---------- подсказка гаснет сама, чтобы не висеть в стриме ----------
  var hintTimer = null
  function flashHint() {
    document.body.classList.add('show-hint')
    hint.classList.remove('fade')
    if (hintTimer) clearTimeout(hintTimer)
    hintTimer = setTimeout(function () {
      hint.classList.add('fade')
      setTimeout(function () { document.body.classList.remove('show-hint') }, 500)
    }, 3500)
  }

  // ---------- связь с главным процессом ----------
  if (api) {
    api.onState(function (s) {
      var wasActive = state.active
      state.active = !!(s && s.active)
      document.body.classList.toggle('drawing', state.active)
      if (!state.active) {
        closeTextInput(false)
        drawingNow = false
        current = null
        // Вышли из рисования - режим мыши больше не нужен, иначе следующий вход будет без рисования.
        cursorMode = false
        ignoreNow = false
        document.body.classList.remove('cursor-mode')
        syncBar()
      } else if (!wasActive) {
        flashHint()
      }
      dirty = true
    })
    api.onCommand(function (cmd) {
      if (cmd === 'undo') undo()
      if (cmd === 'clear') clearAll()
      if (cmd === 'cursor') setCursorMode(!cursorMode)
    })
  }

  syncBar()
})()
</script>
</body>
</html>
