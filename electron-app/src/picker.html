<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Выберите экран или окно</title>
<style>
  /* Voice Lobby · выбор источника демонстрации.
     Тот же язык, что и в вебе: тёмные поверхности, синий акцент #0458cf,
     умеренные радиусы, системный шрифт. */
  :root {
    --bg: #0f1115;
    --surface: #15181e;
    --surface-2: #1b1f27;
    --text: #f2f5f9;
    --text-dim: rgba(242, 245, 249, 0.66);
    --accent: #0458cf;
    --accent-hover: #0b68e8;
    --accent-soft: #6ea8f5;
    --rule: rgba(242, 245, 249, 0.12);
    --rule-strong: rgba(242, 245, 249, 0.26);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(0.16, 0.84, 0.24, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 20px 20px 18px;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    font-family: var(--sans);
    font-size: 19px;
    font-weight: 650;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    color: var(--text);
  }
  h1::after {
    content: "Выберите источник — двойной клик сразу начнёт демонстрацию";
    display: block;
    margin-top: 6px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
    font: 400 13px/1.45 var(--sans);
    letter-spacing: 0;
    color: var(--text-dim);
  }
  h2.group-title {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text-dim);
    margin: 16px 0 9px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding-right: 4px;
  }
  .grids-wrap {
    max-height: 300px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(4, 88, 207, 0.75) transparent;
  }
  .grids-wrap::-webkit-scrollbar { width: 9px; }
  .grids-wrap::-webkit-scrollbar-track { background: rgba(242, 245, 249, 0.05); border-radius: 8px; }
  .grids-wrap::-webkit-scrollbar-thumb { background: rgba(4, 88, 207, 0.7); border-radius: 8px; }
  .grids-wrap::-webkit-scrollbar-thumb:hover { background: var(--accent-hover); }

  /* Плитка источника */
  .item {
    position: relative;
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 7px;
    cursor: pointer;
    background: var(--surface);
    transition: border-color 180ms var(--ease), transform 180ms var(--ease), background 180ms var(--ease), box-shadow 180ms var(--ease);
  }
  .item:hover { border-color: var(--rule-strong); transform: translateY(-2px); background: var(--surface-2); }
  .item.selected {
    border-color: var(--accent);
    background: var(--surface-2);
    box-shadow: 0 0 0 1px var(--accent), 0 10px 24px rgba(4, 88, 207, 0.22);
  }
  .item img {
    width: 100%;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    background: #000;
    display: block;
  }
  .item .name {
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0;
    margin-top: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-dim);
  }
  .item.selected .name { color: var(--text); }

  .audio-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--rule);
    background: var(--surface);
  }
  .audio-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    margin: 1px 0 0;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .audio-row label {
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--text);
    cursor: pointer;
    display: block;
  }
  .audio-row .audio-hint {
    font: 400 12.5px/1.45 var(--sans);
    color: var(--text-dim);
    margin-top: 5px;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
  }
  button {
    position: relative;
    border: 1px solid var(--rule-strong);
    border-radius: 12px;
    padding: 12px 22px;
    min-height: 44px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0;
    cursor: pointer;
    transition: color 180ms var(--ease), background 180ms var(--ease), border-color 180ms var(--ease), transform 140ms var(--ease);
  }
  button:not(:disabled):active { transform: scale(0.985); }
  button:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
  .btn-cancel { background: transparent; color: var(--text-dim); }
  .btn-cancel:hover { color: var(--text); border-color: var(--text-dim); background: rgba(242, 245, 249, 0.06); }
  .btn-share {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 8px 20px rgba(4, 88, 207, 0.28);
  }
  .btn-share:not(:disabled):hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-share:disabled {
    background: transparent;
    color: rgba(242, 245, 249, 0.3);
    border-color: var(--rule);
    box-shadow: none;
    cursor: not-allowed;
  }
  .empty-hint {
    font: 400 13px/1.45 var(--sans);
    color: var(--text-dim);
    padding: 10px 0;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 1ms !important; }
    .item:hover { transform: none; }
  }
</style>
</head>
<body>
  <h1>Выберите, что демонстрировать</h1>
  <div class="grids-wrap">
    <h2 class="group-title">Экраны</h2>
    <div class="grid" id="gridScreens"></div>
    <h2 class="group-title">Окна</h2>
    <div class="grid" id="gridWindows"></div>
  </div>

  <div class="audio-row">
    <input type="checkbox" id="audioCheckbox" checked />
    <div>
      <label for="audioCheckbox">Поделиться звуком стрима</label>
      <div class="audio-hint" id="audioHint">Звук всегда захватывается вместе с демонстрацией — можно включать/выключать в любой момент прямо во время звонка.</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-cancel" id="cancelBtn">Отмена</button>
    <button class="btn-share" id="shareBtn" disabled>Демонстрировать</button>
  </div>

  <script>
    let selectedId = null
    let selectedType = null
    const gridScreens = document.getElementById('gridScreens')
    const gridWindows = document.getElementById('gridWindows')
    const shareBtn = document.getElementById('shareBtn')
    const cancelBtn = document.getElementById('cancelBtn')
    const audioCheckbox = document.getElementById('audioCheckbox')
    const audioHint = document.getElementById('audioHint')

    function selectItem(item, s) {
      document.querySelectorAll('.item').forEach((el) => el.classList.remove('selected'))
      item.classList.add('selected')
      selectedId = s.id
      selectedType = s.type
      shareBtn.disabled = false
      // Захват системного звука на Windows не изолируется по конкретному окну - при выборе окна
      // всё равно будет слышен звук всей системы, а не только этого приложения. Предупреждаем,
      // но НЕ блокируем чекбокс - звук демонстрации должен быть доступен всегда, по требованию.
      audioHint.textContent = s.type === 'window'
        ? 'При демонстрации отдельного окна захватывается звук всей системы (ограничение Windows) - выбирайте "Экраны" выше, если нужен точечный захват звука приложения.'
        : 'Звук всегда захватывается вместе с демонстрацией — можно включать/выключать в любой момент прямо во время звонка.'
    }

    function renderGroup(container, sources) {
      container.innerHTML = ''
      if (!sources.length) {
        container.appendChild(Object.assign(document.createElement('div'), { className: 'empty-hint', textContent: 'Ничего не найдено' }))
        return
      }
      sources.forEach((s) => {
        const item = document.createElement('div')
        item.className = 'item'
        item.innerHTML = `<img src="${s.thumbnail}" /><div class="name">${s.name}</div>`
        item.addEventListener('click', () => selectItem(item, s))
        item.addEventListener('dblclick', () => {
          selectItem(item, s)
          window.pickerAPI.choose(s.id, audioCheckbox.checked)
        })
        container.appendChild(item)
      })
    }

    window.pickerAPI.onSources((sources) => {
      renderGroup(gridScreens, sources.filter((s) => s.type === 'screen'))
      renderGroup(gridWindows, sources.filter((s) => s.type === 'window'))
    })

    shareBtn.addEventListener('click', () => {
      if (selectedId) window.pickerAPI.choose(selectedId, audioCheckbox.checked)
    })
    cancelBtn.addEventListener('click', () => window.pickerAPI.cancel())
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.pickerAPI.cancel() })
  </script>
</body>
</html>
