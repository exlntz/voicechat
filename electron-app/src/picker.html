<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Выберите экран или окно</title>
<style>
  /* Voice Lobby · выбор источника демонстрации.
     Тот же язык, что и в вебе: тёмные поверхности, синий акцент #0458cf,
     умеренные радиусы, системный шрифт.

     Раскладка окна: шапка и низ (звук + кнопки) закреплены, прокручивается ТОЛЬКО
     список источников и только по вертикали. Раньше окно прокручивалось целиком
     (вторая полоса у рамки), а у списка появлялась ещё и горизонтальная полоса:
     треки grid были minmax(auto, 1fr), и длинные заголовки окон растягивали колонки
     за границу окна - плитки получались разного размера и уезжали вправо. */
  :root {
    --bg: #0f1115;
    --surface: #15181e;
    --surface-2: #1b1f27;
    --shot-bg: #0a0c10;
    --text: #f2f5f9;
    --text-dim: rgba(242, 245, 249, 0.66);
    --accent: #0458cf;
    --accent-hover: #0b68e8;
    --accent-soft: #6ea8f5;
    --rule: rgba(242, 245, 249, 0.12);
    --rule-strong: rgba(242, 245, 249, 0.26);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(0.16, 0.84, 0.24, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden; /* прокрутка живёт только внутри .list */
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---- Шапка ---- */
  .head {
    flex: 0 0 auto;
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--rule);
  }
  h1 {
    font-size: 19px;
    font-weight: 650;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--text);
  }
  .head .sub {
    font: 400 13px/1.45 var(--sans);
    color: var(--text-dim);
  }

  /* ---- Список источников: единственная область прокрутки ---- */
  .list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 22px 18px;
    scrollbar-width: thin;
    scrollbar-color: rgba(4, 88, 207, 0.75) transparent;
    /* Подсказка композитору только про прокрутку - will-change на самих плитках
       (их десятки) наоборот съел бы память и замедлил окно */
    will-change: scroll-position;
  }
  .list::-webkit-scrollbar { width: 10px; }
  .list::-webkit-scrollbar-track { background: rgba(242, 245, 249, 0.05); border-radius: 8px; }
  .list::-webkit-scrollbar-thumb { background: rgba(4, 88, 207, 0.7); border-radius: 8px; }
  .list::-webkit-scrollbar-thumb:hover { background: var(--accent-hover); }

  .group[hidden] { display: none; }
  .group-title {
    position: sticky;
    top: 0;
    z-index: 1;
    margin: 0;
    padding: 14px 0 9px;
    background: var(--bg);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text-dim);
  }

  /* Все плитки одного размера: колонки minmax(0, ...) не растягиваются под длинные
     заголовки, картинка всегда в рамке 16:9, подпись - одна строка с многоточием. */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
    align-items: start;
  }

  /* Производительность списка (баг "окно выбора сильно лагает при скролле"):
     - никаких box-shadow/filter/backdrop-filter на плитках: каждая тень на плитке
       заставляла композитор перерисовывать её при любом сдвиге списка;
     - transition только по border-color (цвет фона меняется вместе с ним, но без тени);
     - content-visibility: auto - плитки за пределами видимой области вообще не
       раскладываются и не растрируются, а contain-intrinsic-size держит правильную
       высоту, чтобы полоса прокрутки не "дышала";
     - contain: layout paint - изменения внутри плитки не выходят наружу. */
  .item {
    position: relative;
    min-width: 0;
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    background: var(--surface);
    transition: border-color 180ms var(--ease);
    content-visibility: auto;
    contain-intrinsic-size: auto 158px;
    contain: layout paint;
  }
  .item:hover { border-color: var(--rule-strong); background: var(--surface-2); }
  .item.selected {
    border-color: var(--accent);
    background: var(--surface-2);
    /* Вместо box-shadow - внутренняя обводка: рисуется в том же слое, без размытия */
    outline: 1px solid var(--accent);
    outline-offset: -2px;
  }
  .item .shot {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 9px;
    background: var(--shot-bg);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* object-fit не подходит: окна бывают вертикальными, и cover обрезал бы половину.
     Вписываем превью целиком - размер плитки при этом остаётся одинаковым. */
  .item .shot img {
    max-width: 100%;
    max-height: 100%;
    display: block;
    /* Превью подставляется лениво (см. IntersectionObserver ниже) - лёгкое проявление,
       чтобы подстановка src не выглядела как мигание */
    opacity: 0;
    transition: opacity 120ms linear;
  }
  .item .shot img.ready { opacity: 1; }
  /* Фиксированная высота строки с подписью: иначе плитки с иконкой приложения
     оказывались на пару пикселей выше плиток без неё (экраны). */
  .item .row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 9px;
    min-width: 0;
    height: 18px;
  }
  .item .row .icon {
    width: 16px;
    height: 16px;
    flex: 0 0 auto;
    border-radius: 3px;
    object-fit: contain;
  }
  .item .name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 12.5px;
    line-height: 18px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-dim);
  }
  .item.selected .name { color: var(--text); }
  .item .tick {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(0, 0, 0, 0.45);
  }
  .item.selected .tick { display: flex; }

  /* ---- Низ окна: звук + действия ---- */
  .foot {
    flex: 0 0 auto;
    padding: 14px 22px 18px;
    border-top: 1px solid var(--rule);
    background: var(--bg);
  }
  .audio-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--rule);
    background: var(--surface);
  }
  .audio-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    margin: 1px 0 0;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .audio-row label {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    display: block;
  }
  .audio-row .audio-hint {
    font: 400 12.5px/1.45 var(--sans);
    color: var(--text-dim);
    margin-top: 5px;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }
  button {
    border: 1px solid var(--rule-strong);
    border-radius: 12px;
    padding: 12px 22px;
    min-height: 44px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    color: inherit;
    cursor: pointer;
    transition: color 180ms var(--ease), background 180ms var(--ease), border-color 180ms var(--ease), transform 140ms var(--ease);
  }
  button:not(:disabled):active { transform: scale(0.985); }
  button:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
  .btn-cancel { background: transparent; color: var(--text-dim); }
  .btn-cancel:hover { color: var(--text); border-color: var(--text-dim); background: rgba(242, 245, 249, 0.06); }
  .btn-share {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 8px 20px rgba(4, 88, 207, 0.28);
  }
  .btn-share:not(:disabled):hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-share:disabled {
    background: transparent;
    color: rgba(242, 245, 249, 0.3);
    border-color: var(--rule);
    box-shadow: none;
    cursor: not-allowed;
  }
  .empty-hint {
    font: 400 13px/1.45 var(--sans);
    color: var(--text-dim);
    padding: 18px 0;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
  <div class="head">
    <h1>Выберите, что демонстрировать</h1>
    <div class="sub">Двойной клик по плитке сразу начнёт демонстрацию</div>
  </div>

  <div class="list" id="list">
    <div class="group" id="groupScreens">
      <h2 class="group-title">Экраны</h2>
      <div class="grid" id="gridScreens"></div>
    </div>
    <div class="group" id="groupWindows">
      <h2 class="group-title">Окна</h2>
      <div class="grid" id="gridWindows"></div>
    </div>
    <div class="empty-hint" id="emptyHint" hidden>Не удалось найти ни один экран или окно</div>
  </div>

  <div class="foot">
    <div class="audio-row">
      <input type="checkbox" id="audioCheckbox" checked />
      <div>
        <label for="audioCheckbox">Поделиться звуком стрима</label>
        <div class="audio-hint" id="audioHint">Звук всегда захватывается вместе с демонстрацией — можно включать/выключать в любой момент прямо во время звонка.</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-cancel" id="cancelBtn">Отмена</button>
      <button class="btn-share" id="shareBtn" disabled>Демонстрировать</button>
    </div>
  </div>

  <script>
    let selectedId = null
    const gridScreens = document.getElementById('gridScreens')
    const gridWindows = document.getElementById('gridWindows')
    const groupScreens = document.getElementById('groupScreens')
    const groupWindows = document.getElementById('groupWindows')
    const emptyHint = document.getElementById('emptyHint')
    const shareBtn = document.getElementById('shareBtn')
    const cancelBtn = document.getElementById('cancelBtn')
    const audioCheckbox = document.getElementById('audioCheckbox')
    const audioHint = document.getElementById('audioHint')

    const AUDIO_HINT_DEFAULT = 'Звук всегда захватывается вместе с демонстрацией — можно включать/выключать в любой момент прямо во время звонка.'
    const AUDIO_HINT_WINDOW = 'При демонстрации отдельного окна захватывается звук всей системы (ограничение Windows) — выбирайте «Экраны» выше, если нужен точечный захват звука приложения.'

    function selectItem(item, s) {
      document.querySelectorAll('.item.selected').forEach((el) => el.classList.remove('selected'))
      item.classList.add('selected')
      selectedId = s.id
      shareBtn.disabled = false
      // Захват системного звука на Windows не изолируется по конкретному окну - при выборе окна
      // всё равно будет слышен звук всей системы, а не только этого приложения. Предупреждаем,
      // но НЕ блокируем чекбокс - звук демонстрации должен быть доступен всегда, по требованию.
      audioHint.textContent = s.type === 'window' ? AUDIO_HINT_WINDOW : AUDIO_HINT_DEFAULT
    }

    function choose() {
      if (selectedId) window.pickerAPI.choose(selectedId, audioCheckbox.checked)
    }

    // ---- Ленивая подстановка превью ----
    // Раньше все превью присваивались в img.src сразу: браузеру приходилось декодировать
    // десятки base64-картинок одновременно, из-за чего окно заметно лагало при скролле.
    // Теперь data-URL висит в data-src, а реальный src подставляется только когда плитка
    // подходит к видимой области. Один раз загруженное превью больше не сбрасывается -
    // это и есть кэш: повторная прокрутка не вызывает новых декодирований.
    // Наблюдаем за самой плиткой, а не за <img>: при content-visibility: auto содержимое
    // плитки вне экрана не раскладывается, и наблюдатель на картинке мог бы не сработать.
    const lazyObserver = 'IntersectionObserver' in window
      ? new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue
            loadThumb(entry.target.querySelector('img'))
            lazyObserver.unobserve(entry.target)
          }
        }, { root: document.getElementById('list'), rootMargin: '400px 0px' })
      : null

    function loadThumb(img) {
      if (!img) return
      const src = img.dataset.src
      if (!src) return
      img.removeAttribute('data-src')
      img.src = src
      if (img.complete) img.classList.add('ready')
    }

    function makeItem(s) {
      const item = document.createElement('div')
      item.className = 'item'
      item.tabIndex = 0

      const shot = document.createElement('div')
      shot.className = 'shot'
      const img = document.createElement('img')
      img.alt = ''
      img.decoding = 'async'
      img.dataset.src = s.thumbnail
      img.addEventListener('load', () => img.classList.add('ready'), { once: true })
      shot.appendChild(img)
      if (lazyObserver) lazyObserver.observe(item)
      else loadThumb(img)

      const row = document.createElement('div')
      row.className = 'row'
      if (s.icon) {
        const icon = document.createElement('img')
        icon.className = 'icon'
        icon.src = s.icon
        icon.alt = ''
        row.appendChild(icon)
      }
      const name = document.createElement('div')
      name.className = 'name'
      // Именно textContent, а не innerHTML: заголовок чужого окна - это внешние данные,
      // и через innerHTML он попадал бы в разметку как есть.
      name.textContent = s.name
      name.title = s.name
      row.appendChild(name)

      const tick = document.createElement('div')
      tick.className = 'tick'
      tick.textContent = '✓'

      item.appendChild(shot)
      item.appendChild(row)
      item.appendChild(tick)

      item.addEventListener('click', () => selectItem(item, s))
      item.addEventListener('dblclick', () => { selectItem(item, s); choose() })
      item.addEventListener('focus', () => selectItem(item, s))
      return item
    }

    function renderGroup(group, container, sources) {
      container.innerHTML = ''
      group.hidden = !sources.length
      sources.forEach((s) => container.appendChild(makeItem(s)))
    }

    window.pickerAPI.onSources((sources) => {
      const list = Array.isArray(sources) ? sources : []
      if (lazyObserver) lazyObserver.disconnect() // старые плитки сейчас будут выброшены
      renderGroup(groupScreens, gridScreens, list.filter((s) => s.type === 'screen'))
      renderGroup(groupWindows, gridWindows, list.filter((s) => s.type === 'window'))
      emptyHint.hidden = list.length > 0
    })

    shareBtn.addEventListener('click', choose)
    cancelBtn.addEventListener('click', () => window.pickerAPI.cancel())
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.pickerAPI.cancel()
      if (e.key === 'Enter' && selectedId) { e.preventDefault(); choose() }
    })
  </script>
</body>
</html>
