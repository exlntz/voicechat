<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Выберите экран или окно</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0f1115;
    color: #e8e9ec;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    padding: 16px;
    user-select: none;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 12px;
    color: #cfd2d8;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .item {
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 6px;
    cursor: pointer;
    background: #1a1d24;
    transition: border-color .15s;
  }
  .item:hover { border-color: #3b82f6; }
  .item.selected { border-color: #3b82f6; background: #1c2333; }
  .item img {
    width: 100%;
    height: 90px;
    object-fit: cover;
    border-radius: 4px;
    background: #000;
    display: block;
  }
  .item .name {
    font-size: 11px;
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #b7bac1;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }
  button {
    border: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn-cancel { background: #2a2e37; color: #d3d5da; }
  .btn-cancel:hover { background: #343945; }
  .btn-share { background: #3b82f6; color: #fff; }
  .btn-share:disabled { background: #2a3550; color: #7c8598; cursor: not-allowed; }
  .btn-share:not(:disabled):hover { background: #2f6fdb; }
</style>
</head>
<body>
  <h1>Выберите, что демонстрировать</h1>
  <div class="grid" id="grid"></div>
  <div class="actions">
    <button class="btn-cancel" id="cancelBtn">Отмена</button>
    <button class="btn-share" id="shareBtn" disabled>Демонстрировать</button>
  </div>

  <script>
    let selectedId = null
    const grid = document.getElementById('grid')
    const shareBtn = document.getElementById('shareBtn')
    const cancelBtn = document.getElementById('cancelBtn')

    window.pickerAPI.onSources((sources) => {
      grid.innerHTML = ''
      sources.forEach((s) => {
        const item = document.createElement('div')
        item.className = 'item'
        item.innerHTML = `<img src="${s.thumbnail}" /><div class="name">${s.name}</div>`
        item.addEventListener('click', () => {
          document.querySelectorAll('.item').forEach((el) => el.classList.remove('selected'))
          item.classList.add('selected')
          selectedId = s.id
          shareBtn.disabled = false
        })
        item.addEventListener('dblclick', () => {
          window.pickerAPI.choose(s.id)
        })
        grid.appendChild(item)
      })
    })

    shareBtn.addEventListener('click', () => {
      if (selectedId) window.pickerAPI.choose(selectedId)
    })
    cancelBtn.addEventListener('click', () => window.pickerAPI.cancel())
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.pickerAPI.cancel() })
  </script>
</body>
</html>
