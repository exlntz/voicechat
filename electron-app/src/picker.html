<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Выберите экран или окно</title>
<style>
  /* ═══ АНКЕР · выбор источника демонстрации ═══
     Тот же язык, что и в вебе: чернила, кость, латунь, нулевые радиусы,
     плакатный Impact в заголовке, моношрифт в служебных подписях. */
  :root {
    --ink: #0F0D0B;
    --ink-2: #16120E;
    --ink-3: #1C1712;
    --bone: #E9E1D0;
    --bone-dim: #B9AE99;
    --brass: #B8892F;
    --brass-lt: #E4BF6C;
    --lume: #93E7B4;
    --rule: rgba(233, 225, 208, 0.14);
    --dsp: Impact, Haettenschweiler, "Arial Narrow Bold", "Franklin Gothic Heavy", sans-serif;
    --srf: Constantia, "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --mno: Consolas, "Courier New", ui-monospace, monospace;
    --ease: cubic-bezier(0.16, 0.84, 0.24, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      repeating-linear-gradient(115deg, rgba(233, 225, 208, 0.022) 0 1px, transparent 1px 10px),
      radial-gradient(100% 70% at 88% 0%, rgba(184, 137, 47, 0.13) 0%, transparent 62%),
      var(--ink);
    color: var(--bone);
    font-family: var(--mno);
    padding: 18px 18px 16px;
    user-select: none;
  }
  h1 {
    font-family: var(--dsp);
    font-size: 25px;
    font-weight: 400;
    line-height: 0.9;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: var(--bone);
  }
  /* Курсивная сноска под заголовком — «подпись мастера» */
  h1::after {
    content: "выберите источник · двойной клик — сразу в эфир";
    display: block;
    margin-top: 7px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
    font: italic 400 12.5px/1.4 var(--srf);
    letter-spacing: 0;
    text-transform: none;
    color: var(--brass-lt);
    opacity: 0.9;
  }
  h2.group-title {
    font-family: var(--mno);
    font-size: 9.5px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: var(--brass);
    margin: 14px 0 8px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding-right: 4px;
  }
  .grids-wrap {
    max-height: 300px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--brass) transparent;
  }
  .grids-wrap::-webkit-scrollbar { width: 9px; }
  .grids-wrap::-webkit-scrollbar-track { background: rgba(233, 225, 208, 0.05); }
  .grids-wrap::-webkit-scrollbar-thumb { background: rgba(184, 137, 47, 0.55); }
  .grids-wrap::-webkit-scrollbar-thumb:hover { background: var(--brass); }

  /* Плитка источника: хайрлайн + латунная засечка угла при наведении */
  .item {
    position: relative;
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 6px;
    cursor: pointer;
    background: var(--ink-2);
    transition: border-color 180ms var(--ease), transform 180ms var(--ease), background 180ms var(--ease);
  }
  .item::after {
    content: "";
    position: absolute;
    inset: 4px 4px auto auto;
    width: 12px; height: 12px;
    border-top: 1px solid var(--brass-lt);
    border-right: 1px solid var(--brass-lt);
    opacity: 0;
    transition: opacity 180ms var(--ease);
  }
  .item:hover { border-color: var(--brass); transform: translateY(-2px); }
  .item:hover::after { opacity: 1; }
  .item.selected {
    border-color: var(--brass-lt);
    background: var(--ink-3);
    box-shadow: inset 0 0 0 1px rgba(228, 191, 108, 0.35);
  }
  .item.selected::after { opacity: 1; }
  .item img {
    width: 100%;
    height: 90px;
    object-fit: cover;
    border-radius: 0;
    background: #000;
    display: block;
    filter: saturate(0.92) contrast(1.04);
  }
  .item .name {
    font-family: var(--mno);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    margin-top: 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--bone-dim);
  }
  .item.selected .name { color: var(--brass-lt); }

  .audio-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 14px;
    padding: 11px 13px;
    border-radius: 0;
    border: 1px solid var(--rule);
    border-left: 2px solid var(--brass);
    background: var(--ink-2);
  }
  .audio-row input[type="checkbox"] {
    width: 15px;
    height: 15px;
    margin: 1px 0 0;
    accent-color: var(--brass);
    cursor: pointer;
    flex-shrink: 0;
  }
  .audio-row label {
    font-family: var(--mno);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bone);
    cursor: pointer;
    display: block;
  }
  .audio-row .audio-hint {
    font: italic 400 12px/1.45 var(--srf);
    color: var(--bone-dim);
    margin-top: 5px;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
  }
  /* Кнопки: мгновенная заливка «маской», моношрифт, нулевой радиус */
  button {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 10px 20px;
    font-family: var(--mno);
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 200ms var(--ease), border-color 200ms var(--ease), transform 160ms var(--ease);
  }
  button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--brass);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 260ms var(--ease);
    z-index: -1;
  }
  button > * { position: relative; z-index: 1; }
  button:not(:disabled):hover::before { transform: scaleY(1); }
  button:not(:disabled):active { transform: scale(0.985); }
  button:focus-visible { outline: 2px solid var(--brass-lt); outline-offset: 2px; }
  .btn-cancel { background: transparent; color: var(--bone-dim); z-index: 0; }
  .btn-cancel:hover { color: var(--ink); border-color: var(--brass); }
  .btn-share {
    background: var(--bone);
    color: var(--ink);
    border-color: var(--bone);
    z-index: 0;
  }
  .btn-share::before { background: var(--brass-lt); }
  .btn-share:disabled {
    background: transparent;
    color: rgba(233, 225, 208, 0.3);
    border-color: var(--rule);
    cursor: not-allowed;
  }
  .empty-hint {
    font: italic 400 12.5px/1.4 var(--srf);
    color: var(--bone-dim);
    padding: 8px 0;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: 1ms !important; }
    .item:hover { transform: none; }
  }
</style>
</head>
<body>
  <h1>Выберите, что демонстрировать</h1>
  <div class="grids-wrap">
    <h2 class="group-title">Экраны</h2>
    <div class="grid" id="gridScreens"></div>
    <h2 class="group-title">Окна</h2>
    <div class="grid" id="gridWindows"></div>
  </div>

  <div class="audio-row">
    <input type="checkbox" id="audioCheckbox" checked />
    <div>
      <label for="audioCheckbox">Поделиться звуком стрима</label>
      <div class="audio-hint" id="audioHint">Звук всегда захватывается вместе с демонстрацией — можно включать/выключать в любой момент прямо во время звонка.</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-cancel" id="cancelBtn">Отмена</button>
    <button class="btn-share" id="shareBtn" disabled>Демонстрировать</button>
  </div>

  <script>
    let selectedId = null
    let selectedType = null
    const gridScreens = document.getElementById('gridScreens')
    const gridWindows = document.getElementById('gridWindows')
    const shareBtn = document.getElementById('shareBtn')
    const cancelBtn = document.getElementById('cancelBtn')
    const audioCheckbox = document.getElementById('audioCheckbox')
    const audioHint = document.getElementById('audioHint')

    function selectItem(item, s) {
      document.querySelectorAll('.item').forEach((el) => el.classList.remove('selected'))
      item.classList.add('selected')
      selectedId = s.id
      selectedType = s.type
      shareBtn.disabled = false
      // Захват системного звука на Windows не изолируется по конкретному окну - при выборе окна
      // всё равно будет слышен звук всей системы, а не только этого приложения. Предупреждаем,
      // но НЕ блокируем чекбокс - звук демонстрации должен быть доступен всегда, по требованию.
      audioHint.textContent = s.type === 'window'
        ? 'При демонстрации отдельного окна захватывается звук всей системы (ограничение Windows) - выбирайте "Экраны" выше, если нужен точечный захват звука приложения.'
        : 'Звук всегда захватывается вместе с демонстрацией — можно включать/выключать в любой момент прямо во время звонка.'
    }

    function renderGroup(container, sources) {
      container.innerHTML = ''
      if (!sources.length) {
        container.appendChild(Object.assign(document.createElement('div'), { className: 'empty-hint', textContent: 'Ничего не найдено' }))
        return
      }
      sources.forEach((s) => {
        const item = document.createElement('div')
        item.className = 'item'
        item.innerHTML = `<img src="${s.thumbnail}" /><div class="name">${s.name}</div>`
        item.addEventListener('click', () => selectItem(item, s))
        item.addEventListener('dblclick', () => {
          selectItem(item, s)
          window.pickerAPI.choose(s.id, audioCheckbox.checked)
        })
        container.appendChild(item)
      })
    }

    window.pickerAPI.onSources((sources) => {
      renderGroup(gridScreens, sources.filter((s) => s.type === 'screen'))
      renderGroup(gridWindows, sources.filter((s) => s.type === 'window'))
    })

    shareBtn.addEventListener('click', () => {
      if (selectedId) window.pickerAPI.choose(selectedId, audioCheckbox.checked)
    })
    cancelBtn.addEventListener('click', () => window.pickerAPI.cancel())
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.pickerAPI.cancel() })
  </script>
</body>
</html>
